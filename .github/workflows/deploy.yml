name: Build and Push dist Branch for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome and system dependencies for prerendering
        run: sudo -E env "PATH=$PATH" npx puppeteer browsers install chrome --install-deps

      - name: Build production bundle
        env:
          VITE_API_URL: https://api.shavihomes.com/api
          VITE_BACKEND_URL: https://api.shavihomes.com
        run: npm run build

      - name: Push dist contents to dist branch
        run: |
          cd dist
          git init -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy build from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
